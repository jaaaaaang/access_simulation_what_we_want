      ctx.closePath();
      ctx.fillStyle = 'rgba(168,85,247,.10)'; ctx.fill();
      ctx.strokeStyle = '#a855f7'; ctx.lineWidth = 1.5; ctx.setLineDash([6,6]); ctx.stroke(); ctx.setLineDash([]);
    }
    outside.forEach(b => {
      ctx.beginPath();
      b.polygon.forEach((p,i) => { const s = toS(p[0],p[1]); i? ctx.lineTo(...s) : ctx.moveTo(...s); });
      ctx.closePath();
      ctx.fillStyle = 'rgba(48,54,61,.3)'; ctx.fill();
      ctx.strokeStyle = C_OUT_LINE; ctx.lineWidth = 1; ctx.setLineDash([2,2]); ctx.stroke(); ctx.setLineDash([]);
    });
    results.forEach(({b, newW, lowrise}) => {
      ctx.beginPath();
      b.polygon.forEach((p,i) => { const s = toS(p[0],p[1]); i? ctx.lineTo(...s) : ctx.moveTo(...s); });
      ctx.closePath();
      ctx.fillStyle = lowrise && panelIdx===1 ? 'rgba(48,54,61,.6)' : 'rgba(33,38,45,.85)';
      ctx.fill();

      if (panelIdx === 0) {
        // [좌] 베란다 미적용 — 건물 외곽선만
        ctx.strokeStyle = C_BLD_LINE; ctx.lineWidth = 1.6; ctx.stroke();
        b.polygon.forEach((p,i) => {
          const q = b.polygon[(i+1) % b.polygon.length];
          wallCache.old.push({ s1: toS(p[0],p[1]), s2: toS(q[0],q[1]), bld: b.bld_nm, fl: b.floors_above });
        });
      } else {
        // [우] 분류 결과 — 벽면별 색
        const mLonS = 111320.0 * Math.cos(lat0*Math.PI/180);
        newW.forEach(wl => {
          // 미터/캔버스형 좌표 -> lon/lat 복원
          const lon1 = wl.p1.x/mLonS, lat1 = -wl.p1.y/111320.0;
          const lon2 = wl.p2.x/mLonS, lat2 = -wl.p2.y/111320.0;
          const s1 = toS(lon1, lat1), s2 = toS(lon2, lat2);
          drawWall(ctx, s1, s2, wl.wallType);
          wallCache.nu.push({ s1, s2, type: wl.wallType, len: wl.length, az: wl.azimuth, reason: wl.reason || '', bld: b.bld_nm, fl: b.floors_above });
        });
      }
    });
  });
}

// 전부 실선. 굵기로만 위계를 준다 (1차 > 2차 > 콘크리트).
function drawWall(ctx, s1, s2, type) {
  ctx.beginPath(); ctx.moveTo(...s1); ctx.lineTo(...s2);
  if (type === 'first') { ctx.strokeStyle = C_V1; ctx.lineWidth = 3.2; }
  else if (type === 'second') { ctx.strokeStyle = C_V2; ctx.lineWidth = 2.8; }
  else { ctx.strokeStyle = C_CONC; ctx.lineWidth = 1.6; }
  ctx.stroke();
}

// 툴팁
const tip = document.getElementById('tooltip');
const NAME_KO = { first:'1차 베란다', second:'2차 베란다', concrete:'콘크리트' };
const REASON_KO = { end_wall:'판상형 단축 마구리', small_face:'미세면(코어/설비)', front_axis:'판상형 전면 장축', back_axis:'판상형 배면 장축',
  wing_cap:'날개 마구리', sun_front:'수광 전면', rel_front:'경계 상대판정 전면', paired_back:'전면 페어링 배면',
  unpaired_back:'비페어링 배면(깊음)', core_sandwich:'코어 사이 고립면', perp_cap:'수직 마구리(스트립 끝)', lowrise_mask:'저층 부속동' };
['cvOld','cvNew'].forEach((cvId, idx) => {
  const cv = document.getElementById(cvId);
  cv.addEventListener('mousemove', ev => {
    const r = cv.getBoundingClientRect();
    const x = ev.clientX - r.left, y = ev.clientY - r.top;
    const walls = idx === 0 ? wallCache.old : wallCache.nu;
    let best = null, bd = 36;
    walls.forEach(wl => {
      const d = distSeg(x, y, wl.s1, wl.s2);
      if (d < bd) { bd = d; best = wl; }
    });
    if (best) {
      tip.style.display = 'block';
      tip.style.left = (ev.clientX + 14) + 'px';
      tip.style.top = (ev.clientY + 14) + 'px';
      if (idx === 0) {
        tip.textContent = `${best.bld || '건물'}${best.fl ? ' ('+best.fl+'F)' : ''}\n베란다 미적용 (원본 폴리곤)`;
      } else {
        const rk = REASON_KO[best.reason] ? ' | ' + REASON_KO[best.reason] : '';
        tip.textContent = `${best.bld || '건물'}${best.fl ? ' ('+best.fl+'F)' : ''}\n${NAME_KO[best.type]}${rk}\n방위각 ${Math.round(best.az)}° | ${best.len.toFixed(1)}m`;
      }
    } else tip.style.display = 'none';
  });
  cv.addEventListener('mouseleave', () => tip.style.display = 'none');
});
function distSeg(px, py, a, b) {
  const l2 = (a[0]-b[0])**2 + (a[1]-b[1])**2;
  if (!l2) return Math.hypot(px-a[0], py-a[1]);
  let t = ((px-a[0])*(b[0]-a[0]) + (py-a[1])*(b[1]-a[1])) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (a[0]+t*(b[0]-a[0])), py - (a[1]+t*(b[1]-a[1])));
}

window.addEventListener('resize', render);
loadAndRender();
</script>
